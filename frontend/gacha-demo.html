<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>いきものガチャ 演出デモ</title>
<style>
  :root {
    --bg-top: #0b1a3a;
    --bg-bottom: #041022;
    --panel: rgba(255, 255, 255, 0.06);
    --text: #f3f6ff;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-top), var(--bg-bottom) 70%);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px env(safe-area-inset-bottom, 16px);
    position: relative;
  }
  .app.shake { animation: screen-shake 0.45s ease-in-out; }
  .app.shake-big { animation: screen-shake-big 0.65s ease-in-out; }
  @keyframes screen-shake {
    0%, 100% { transform: translate(0, 0); }
    15% { transform: translate(-10px, 6px); }
    30% { transform: translate(9px, -7px); }
    45% { transform: translate(-8px, 5px); }
    60% { transform: translate(7px, -4px); }
    75% { transform: translate(-5px, 3px); }
    90% { transform: translate(3px, -2px); }
  }
  @keyframes screen-shake-big {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    10% { transform: translate(-16px, 10px) rotate(-1deg); }
    25% { transform: translate(14px, -12px) rotate(1deg); }
    40% { transform: translate(-13px, 9px) rotate(-1deg); }
    55% { transform: translate(12px, -8px) rotate(1deg); }
    70% { transform: translate(-9px, 6px); }
    85% { transform: translate(6px, -4px); }
  }

  /* --- 画面全体のフラッシュ（弾ける瞬間の「ドッカーン」） --- */
  .flash-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, #ffffff, #fff3c4 40%, rgba(255,214,102,0) 75%);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }
  .flash-overlay.play { animation: flash-pop 0.5s ease-out forwards; }
  .flash-overlay.super { animation: flash-pop-super 0.7s ease-out forwards; }
  @keyframes flash-pop {
    0% { opacity: 0; }
    12% { opacity: 0.95; }
    100% { opacity: 0; }
  }
  @keyframes flash-pop-super {
    0% { opacity: 0; filter: hue-rotate(0deg); }
    10% { opacity: 1; }
    55% { opacity: 0.5; filter: hue-rotate(60deg); }
    100% { opacity: 0; filter: hue-rotate(120deg); }
  }
  h1 {
    font-size: clamp(18px, 5vw, 26px);
    margin: 0 0 8px;
    text-align: center;
    letter-spacing: 0.04em;
  }
  .sub {
    opacity: 0.7;
    font-size: 13px;
    margin-bottom: 28px;
    text-align: center;
  }

  .stage {
    position: relative;
    width: min(78vw, 320px);
    height: min(78vw, 320px);
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
  }

  /* --- カプセル（抽選前の演出） --- */
  .capsule {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #9ad0ff 40%, #3b6fd6 75%, #1b3a8c 100%);
    box-shadow: 0 0 30px 6px rgba(120, 170, 255, 0.6);
    position: absolute;
    opacity: 1;
    transition: opacity 0.25s ease;
  }
  .capsule.hidden { opacity: 0; pointer-events: none; }
  .capsule.shaking { animation: shake 0.42s ease-in-out infinite, charge-up 0.9s ease-in forwards; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-9px, 3px) rotate(-9deg); }
    40% { transform: translate(9px, -3px) rotate(9deg); }
    60% { transform: translate(-8px, -3px) rotate(-7deg); }
    80% { transform: translate(8px, 3px) rotate(7deg); }
  }
  @keyframes charge-up {
    0% { box-shadow: 0 0 30px 6px rgba(120, 170, 255, 0.6); filter: brightness(1); }
    100% { box-shadow: 0 0 70px 22px var(--charge-glow, rgba(255, 214, 102, 0.95)); filter: brightness(1.5); }
  }
  .capsule.growing {
    animation: grow 0.4s cubic-bezier(.5,-0.2,.7,1) forwards;
  }
  @keyframes grow {
    to { transform: scale(4); opacity: 0; }
  }

  /* --- 充填リング（溜め演出） --- */
  .rings {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .charge-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 96px;
    height: 96px;
    margin: -48px 0 0 -48px;
    border-radius: 50%;
    border: 3px solid rgba(255, 214, 102, 0.9);
    opacity: 0;
    pointer-events: none;
  }
  .charge-ring.on { animation: ring-expand 0.7s ease-out forwards; }
  @keyframes ring-expand {
    0% { opacity: 0.9; transform: scale(0.6); }
    100% { opacity: 0; transform: scale(3.2); }
  }

  /* --- バースト光 --- */
  .burst {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff, #ffe29a 35%, rgba(255,180,80,0) 70%);
    opacity: 0;
    pointer-events: none;
  }
  .burst.play {
    animation: burst-pop 0.65s cubic-bezier(.15,.8,.3,1) forwards;
  }
  @keyframes burst-pop {
    0% { opacity: 1; width: 10px; height: 10px; }
    55% { opacity: 0.7; }
    100% { opacity: 0; width: 620px; height: 620px; }
  }

  /* --- 光線バースト --- */
  .rays {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    pointer-events: none;
  }
  .ray {
    position: absolute;
    top: 0;
    left: 0;
    width: 6px;
    height: 200px;
    margin-left: -3px;
    background: linear-gradient(to top, rgba(255,255,255,0.95), rgba(255,255,255,0));
    transform-origin: 50% 0%;
    opacity: 0;
  }
  .ray.on { animation: ray-shoot 0.6s ease-out forwards; }
  @keyframes ray-shoot {
    0% { opacity: 0.95; transform: scaleY(0.2) rotate(var(--rot)); }
    100% { opacity: 0; transform: scaleY(1.6) rotate(var(--rot)); }
  }

  /* --- カード --- */
  .card-wrap {
    position: absolute;
    width: 220px;
    height: 220px;
    opacity: 0;
    transform: rotateY(180deg) scale(0.85);
    transform-style: preserve-3d;
  }
  .card-wrap.reveal {
    animation: flip-in 0.9s cubic-bezier(.2,.9,.25,1.1) forwards;
  }
  @keyframes flip-in {
    0% { opacity: 0; transform: rotateY(180deg) scale(0.85); }
    45% { opacity: 1; }
    100% { opacity: 1; transform: rotateY(0deg) scale(1); }
  }
  .card {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    background: #0e1830;
    border: 3px solid #8fa5c9;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 18px;
    pointer-events: none;
  }

  /* レアリティごとの縁の光り方 */
  .card-wrap[data-rarity="normal"] .card { border-color: #b9c6dd; }
  .card-wrap[data-rarity="normal"] .card::after { box-shadow: 0 0 18px 2px rgba(185,198,221,0.5) inset; }

  .card-wrap[data-rarity="rare"] .card { border-color: #6fc7ff; }
  .card-wrap[data-rarity="rare"] .card::after {
    box-shadow: 0 0 26px 4px rgba(111,199,255,0.75) inset, 0 0 24px 6px rgba(111,199,255,0.6);
    animation: pulse-glow 1.6s ease-in-out infinite;
  }

  .card-wrap[data-rarity="super"] .card { border-color: #ffd166; border-width: 4px; }
  .card-wrap[data-rarity="super"] .card::after {
    box-shadow: 0 0 34px 6px rgba(255,209,102,0.85) inset, 0 0 34px 10px rgba(255,167,84,0.7);
    animation: pulse-glow 1.1s ease-in-out infinite, hue-shift 3s linear infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }
  @keyframes hue-shift {
    0% { filter: hue-rotate(0deg) brightness(1.15); }
    100% { filter: hue-rotate(360deg) brightness(1.15); }
  }

  /* --- キラキラパーティクル --- */
  .particles {
    position: absolute;
    inset: -40px;
    pointer-events: none;
  }
  .sparkle {
    position: absolute;
    opacity: 0;
    font-size: 16px;
    line-height: 1;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.8));
    will-change: transform, opacity;
  }
  .sparkle.on { animation: sparkle-pop 1.2s ease-out forwards; }
  @keyframes sparkle-pop {
    0% { opacity: 0; transform: translate(0,0) scale(0.2) rotate(0deg); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: var(--end) scale(1) rotate(var(--spin, 0deg)); }
  }

  /* --- 結果テキスト --- */
  .result {
    margin-top: 22px;
    text-align: center;
    min-height: 64px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .result.show { opacity: 1; }
  .rarity-badge {
    display: inline-block;
    padding: 3px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .rarity-badge.normal { background: #b9c6dd; color: #14213d; }
  .rarity-badge.rare { background: linear-gradient(90deg,#6fc7ff,#a0e4ff); color: #06284a; }
  .rarity-badge.super { background: linear-gradient(90deg,#ffd166,#ff9a5c); color: #4a2200; }
  .result-name { font-size: 20px; font-weight: bold; }
  .result-sub { font-size: 12px; opacity: 0.75; margin-top: 2px; }
  .result.show .rarity-badge,
  .result.show .result-name {
    animation: text-pop 0.55s cubic-bezier(.2,1.6,.4,1) both;
  }
  .result.show .result-name { animation-delay: 0.08s; }
  @keyframes text-pop {
    0% { opacity: 0; transform: scale(2.4) rotate(-6deg); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* --- 操作ボタン --- */
  .actions {
    margin-top: 26px;
    display: flex;
    gap: 12px;
  }
  button.gacha-btn {
    appearance: none;
    border: none;
    border-radius: 999px;
    padding: 14px 30px;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(90deg, #ffd166, #ff9a5c);
    color: #3a1e00;
    box-shadow: 0 6px 18px rgba(255, 154, 92, 0.4);
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button.gacha-btn:active { transform: scale(0.96); }
  button.gacha-btn:disabled { opacity: 0.4; cursor: default; }

  .count {
    position: absolute;
    top: max(14px, env(safe-area-inset-top, 14px));
    right: 14px;
    font-size: 12px;
    opacity: 0.55;
  }
</style>
</head>
<body>
<div class="flash-overlay" id="flashOverlay"></div>
<div class="app" id="app">
  <div class="count" id="count"></div>
  <h1>とびだせ！いきものガチャ</h1>
  <p class="sub">海遊館で見つけた生きものが、カードになって登場するよ</p>

  <div class="stage" id="stage">
    <div class="rings" id="rings"></div>
    <div class="capsule" id="capsule"></div>
    <div class="rays" id="rays"></div>
    <div class="burst" id="burst"></div>
    <div class="card-wrap" id="cardWrap">
      <div class="card"><img id="cardImg" src="" alt="" /></div>
      <div class="particles" id="particles"></div>
    </div>
  </div>

  <div class="result" id="result">
    <div class="rarity-badge" id="rarityBadge"></div>
    <div class="result-name" id="resultName"></div>
    <div class="result-sub" id="resultSub"></div>
  </div>

  <div class="actions">
    <button class="gacha-btn" id="pullBtn">ガチャをまわす</button>
  </div>
</div>

<script src="animals-manifest.js"></script>
<script>
  const ANIMALS = window.ANIMALS_MANIFEST || [];
  const countEl = document.getElementById("count");
  countEl.textContent = `いきものずかん ${ANIMALS.length}種`;

  // レアリティは requirements.md 通り「毎回抽選・全結果ポジティブ」の暫定3段階（本実装では #783 で正式決定）
  // 演出の強さ（充填リング・画面シェイク・フラッシュ・光線・パーティクル）はレアリティごとに変えている
  const RARITY_TABLE = [
    {
      key: "super", label: "SSレア", weight: 10, message: "すごい発見だ！！",
      chargeGlow: "rgba(255, 209, 102, 0.95)", ringCount: 4, ringGap: 150,
      shakeClass: "shake-big", flashClass: "super", rayCount: 10,
      particleCount: 36, icons: ["🐟", "✨", "⭐"],
    },
    {
      key: "rare", label: "レア", weight: 30, message: "やったね、レアだ！",
      chargeGlow: "rgba(111, 199, 255, 0.95)", ringCount: 2, ringGap: 240,
      shakeClass: "shake", flashClass: "play", rayCount: 0,
      particleCount: 20, icons: ["🐟", "✨"],
    },
    {
      key: "normal", label: "ノーマル", weight: 60, message: "はっけん！",
      chargeGlow: "rgba(185, 198, 221, 0.9)", ringCount: 1, ringGap: 0,
      shakeClass: null, flashClass: null, rayCount: 0,
      particleCount: 10, icons: ["🐟"],
    },
  ];

  function pickRarity() {
    const total = RARITY_TABLE.reduce((s, r) => s + r.weight, 0);
    let n = Math.random() * total;
    for (const r of RARITY_TABLE) {
      if (n < r.weight) return r;
      n -= r.weight;
    }
    return RARITY_TABLE[RARITY_TABLE.length - 1];
  }

  function pickAnimal() {
    return ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
  }

  function vibrate(pattern) {
    if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") {
      navigator.vibrate(pattern);
    }
  }

  function spawnParticles(container, count, icons) {
    container.innerHTML = "";
    for (let i = 0; i < count; i++) {
      const s = document.createElement("div");
      s.className = "sparkle";
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist = 70 + Math.random() * 120;
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist;
      s.style.left = "50%";
      s.style.top = "50%";
      s.style.fontSize = `${13 + Math.random() * 12}px`;
      s.style.setProperty("--end", `translate(${x}px, ${y}px)`);
      s.style.setProperty("--spin", `${(Math.random() * 2 - 1) * 180}deg`);
      s.style.animationDelay = `${Math.random() * 0.35}s`;
      container.appendChild(s);
      requestAnimationFrame(() => s.classList.add("on"));
    }
  }

  function spawnRings(container, count, gap, color) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const r = document.createElement("div");
        r.className = "charge-ring";
        r.style.borderColor = color;
        container.appendChild(r);
        requestAnimationFrame(() => r.classList.add("on"));
      }, i * gap);
    }
  }

  function spawnRays(container, count) {
    container.innerHTML = "";
    for (let i = 0; i < count; i++) {
      const ray = document.createElement("div");
      ray.className = "ray";
      const rot = (360 / count) * i + Math.random() * 8;
      ray.style.setProperty("--rot", `${rot}deg`);
      container.appendChild(ray);
      requestAnimationFrame(() => ray.classList.add("on"));
    }
  }

  const appEl = document.getElementById("app");
  const flashOverlay = document.getElementById("flashOverlay");
  const rings = document.getElementById("rings");
  const capsule = document.getElementById("capsule");
  const rays = document.getElementById("rays");
  const burst = document.getElementById("burst");
  const cardWrap = document.getElementById("cardWrap");
  const cardImg = document.getElementById("cardImg");
  const particles = document.getElementById("particles");
  const result = document.getElementById("result");
  const rarityBadge = document.getElementById("rarityBadge");
  const resultName = document.getElementById("resultName");
  const resultSub = document.getElementById("resultSub");
  const pullBtn = document.getElementById("pullBtn");

  function resetStage() {
    appEl.classList.remove("shake", "shake-big");
    flashOverlay.className = "flash-overlay";
    rings.innerHTML = "";
    rays.innerHTML = "";
    capsule.className = "capsule";
    capsule.style.removeProperty("--charge-glow");
    burst.className = "burst";
    cardWrap.className = "card-wrap";
    cardWrap.removeAttribute("data-rarity");
    particles.innerHTML = "";
    result.classList.remove("show");
  }

  async function playGacha() {
    if (!ANIMALS.length) {
      alert("images/animals にまだ画像がありません。build-manifest.mjs を再実行してください。");
      return;
    }
    pullBtn.disabled = true;
    resetStage();

    const animal = pickAnimal();
    const rarity = pickRarity();
    cardImg.src = animal.file;
    cardImg.alt = animal.name;

    // 1. カプセルが震えながら光を溜める（レアリティごとにリングの数・色が変わる）
    capsule.style.setProperty("--charge-glow", rarity.chargeGlow);
    capsule.classList.add("shaking");
    if (rarity.ringCount > 0) spawnRings(rings, rarity.ringCount, rarity.ringGap || 260, rarity.chargeGlow);
    vibrate([40, 60, 40]);
    await sleep(900);

    // 2. ドッカーン！ カプセルが弾ける（レアリティが高いほど画面ゆれ・フラッシュ・光線が強くなる）
    capsule.classList.remove("shaking");
    capsule.classList.add("growing");
    burst.classList.add("play");
    if (rarity.flashClass) flashOverlay.classList.add(rarity.flashClass);
    if (rarity.shakeClass) appEl.classList.add(rarity.shakeClass);
    if (rarity.rayCount > 0) spawnRays(rays, rarity.rayCount);
    vibrate(rarity.key === "super" ? [0, 30, 40, 30, 140] : rarity.key === "rare" ? [0, 25, 30, 60] : [0, 60]);
    await sleep(350);
    capsule.classList.add("hidden");

    // 3. カードが3D回転で登場
    cardWrap.setAttribute("data-rarity", rarity.key);
    cardWrap.classList.add("reveal");
    await sleep(500);
    spawnParticles(particles, rarity.particleCount, rarity.icons);

    // 4. 結果テキスト表示（ポップに拡大しながら出る）
    rarityBadge.textContent = rarity.label;
    rarityBadge.className = `rarity-badge ${rarity.key}`;
    resultName.textContent = `${animal.name} を${rarity.message}`;
    resultSub.textContent = `${animal.scientificName} / ${animal.family || ""}`;
    result.classList.add("show");

    pullBtn.disabled = false;
    pullBtn.textContent = "もういちどまわす";
  }

  function sleep(ms) {
    return new Promise((r) => setTimeout(r, ms));
  }

  pullBtn.addEventListener("click", playGacha);
</script>
</body>
</html>
